# Development only. Run tools with: docker compose -f docker-compose.dev.yml run --rm dev just test
# A separate project name keeps the test database and dev app apart from a greydoc run with docker-compose.yml.
name: greydoc-dev

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: greydoc-dev
    working_dir: /src
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
      - npmcache:/root/.npm
      - uinodemodules:/src/ui/node_modules
    env_file:
      - path: .env
        required: false
    environment:
      GREYDOC_TEST_POSTGRES_URL: ${GREYDOC_TEST_POSTGRES_URL:-}

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: greydoc
      POSTGRES_PASSWORD: greydoc
      POSTGRES_DB: greydoc
    profiles: ["postgres"]

  app:
    image: greydoc-dev
    working_dir: /src
    command: go run ./cmd/greydoc serve
    ports:
      - "127.0.0.1:43031:3000"
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
      - appdata:/data
    env_file:
      - path: .env
        required: false
    environment:
      GREYDOC_HOST: 0.0.0.0
      GREYDOC_ALLOW_NONLOCAL: "1"
      GREYDOC_DATABASE_URL: /data/greydoc.db
      GREYDOC_DATA_DIR: /data
      GREYDOC_SECRET_FILE: /data/secret

# Fixed names keep the caches made before the project had its own name.
volumes:
  gomod:
    name: greydoc_gomod
  gocache:
    name: greydoc_gocache
  npmcache:
    name: greydoc_npmcache
  uinodemodules:
    name: greydoc_uinodemodules
  appdata:
    name: greydoc_appdata
